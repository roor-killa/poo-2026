
services:
  postgres-5111:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poo_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/02_documents.sql:/docker-entrypoint-initdb.d/02_documents.sql:ro
      - ./db/04_rc_schema.sql:/docker-entrypoint-initdb.d/04_rc_schema.sql:ro
      - ./db/05_rag_schema.sql:/docker-entrypoint-initdb.d/05_rag_schema.sql:ro
    ports:
      - "${POSTGRES_PORT:-5111}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend-8111:
    build:
      context: ./rci_next_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8111}:3000"
    depends_on:
      postgres-5111:
        condition: service_healthy
    working_dir: /app
    environment:
      - NODE_ENV=production
      - POSTGRES_HOST=postgres-5111
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-poo_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}

  nginx-81:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-81}:81"
    depends_on:
      - frontend-8111
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:



