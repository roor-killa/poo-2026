
services:
  postgres:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poo_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/02_documents.sql:/docker-entrypoint-initdb.d/02_documents.sql:ro
      - ./db/04_rc_schema.sql:/docker-entrypoint-initdb.d/04_rc_schema.sql:ro
      - ./db/05_rag_schema.sql:/docker-entrypoint-initdb.d/05_rag_schema.sql:ro
    ports:
      - "${POSTGRES_PORT:-5431}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rci_group1_network

  rci_group1_next_frontend:
    build:
      context: ./rci_next_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3011}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    environment:
      - NODE_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-poo_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    networks:
      - rci_group1_network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "81:80"
    depends_on:
      - rci_group1_next_frontend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - rci_group1_network

volumes:
  postgres_data:
    name: rci_group1_poo_postgres


