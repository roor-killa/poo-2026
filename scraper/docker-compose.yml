
services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: rci_toma_poo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poo_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scraper/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./scraper/db/02_documents.sql:/docker-entrypoint-initdb.d/02_documents.sql:ro
      - ./scraper/db/04_rc_schema.sql:/docker-entrypoint-initdb.d/04_rc_schema.sql:ro
      - ./scraper/db/05_rag_schema.sql:/docker-entrypoint-initdb.d/05_rag_schema.sql:ro
    ports:
      - "${POSTGRES_PORT:-5437}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rci_next_frontend:
    build:
      context: ./rci_next_frontend
    container_name: rci_next_frontend
    restart: unless-stopped
    ports:
      - "3007:3000"
    depends_on:
      - postgres
    working_dir: /app
    environment:
      - NODE_ENV=production

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "87:80"
    depends_on:
      - rci_toma_next_frontend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
    name: rci_toma_poo_postgresclear
    

