# Nginx configuration for production
# Serves Next.js frontend on / and proxies /api to backend if needed

server {
    listen 80;
    server_name _;

    # Proxy all requests to the Next.js frontend container (internal Docker network)
    location / {
        proxy_pass http://rci_toma_next_frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Show custom error page if frontend is down
        error_page 502 503 504 /custom_50x.html;
    }

    location = /custom_50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}