name: CI/CD — BusTrack MQ

on:
  push:
    branches: [main, develop]
    paths:
      - "TP_bus_track/backend/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "TP_bus_track/backend/**"

jobs:
  # ── Intégration Continue ────────────────────────────────────────────────────
  ci:
    name: Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TP_bus_track/backend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: TP_bus_track/backend/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lint avec ruff
        run: |
          pip install ruff
          ruff check .

      - name: Exécuter les tests (couverture > 70 %)
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:password@localhost:5432/bustrack_mq"
          SECRET_KEY: "test_secret_key"
          CORS_ORIGINS: '["http://localhost:3000"]'
        run: |
          pytest --cov=. --cov-report=term-missing --cov-fail-under=70 -v

      - name: Build de l'image Docker
        run: docker build -t bustrack-mq-api:ci .

  # ── Déploiement Continu ─────────────────────────────────────────────────────
  cd:
    name: Déploiement Railway
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: TP_bus_track/backend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Se connecter à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: TP_bus_track/backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/bustrack-mq-api:latest

      - name: Déployer sur Railway
        uses: bervProject/railway-deploy@v1.2.0
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: bustrack-mq-api

      - name: Vérification de santé post-déploiement
        run: |
          echo "Attente du démarrage..."
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.RAILWAY_API_URL }}/health)
          if [ "$STATUS" != "200" ]; then
            echo "Health check échoué (HTTP $STATUS)"
            exit 1
          fi
          echo "Déploiement validé (HTTP 200)"
