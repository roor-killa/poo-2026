services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bustrack_mq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/bustrack_mq
      SECRET_KEY: changeme_dev_key
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:3001"]'
      SIMULATION_INTERVAL: "4"
      VAPID_PRIVATE_KEY: ""
      VAPID_PUBLIC_KEY: ""
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
