services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bizouk
      POSTGRES_USER: bizouk
      POSTGRES_PASSWORD: bizouk_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizouk -d bizouk"]
      interval: 5s
      timeout: 5s
      retries: 10

  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://bizouk:bizouk_secret@db:5432/bizouk
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./fastapi:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  laravel:
    build:
      context: ./laravel
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: "Bizouk Events"
      APP_ENV: local
      APP_KEY: base64:Gs9aQa1uMVnKSenl7nIllM0nDgKnPnADyr+jFBFrmKE=
      APP_DEBUG: "true"
      APP_URL: http://localhost
      LOG_CHANNEL: stderr
      SESSION_DRIVER: file
      FASTAPI_URL: http://fastapi:8000
    depends_on:
      fastapi:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  pgdata:
