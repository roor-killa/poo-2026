version: '3.8'

services:
  api_bus:
    build: .
    container_name: fastapi_bus_martinique
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: postgres_bus_martinique
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: bus_martinique_db
    ports:
      - "5432:5432"