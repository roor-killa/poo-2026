services:
  backend:
    build:
      context: ./backend
    container_name: transport-martinique-backend
    ports:
      - "8000:8000"

  db:
    image: postgres:15
    container_name: transport-martinique-db
    environment:
      POSTGRES_DB: transport
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: transport-martinique-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: transport-martinique-frontend
    depends_on:
      - backend
      - db
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
    ports:
      - "3000:3000"

volumes:
  pgdata:
