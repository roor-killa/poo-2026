# nginx reverse-proxy for the bus-tracking system.
#
# Port layout (from spec §1.3):
#   443        — public HTTPS: REST API + static site + WS /ws/buses
#   80         — redirect to HTTPS
#   127.0.0.1:8080 — admin only: REST API + WS /ws/admin  (no external access)
#
# TLS certificates are expected at:
#   /etc/nginx/certs/fullchain.pem
#   /etc/nginx/certs/privkey.pem
# Mount them via the `certs` volume in docker-compose.yml.
#
# The FastAPI application runs on the `api` Docker service at port 8000.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # -----------------------------------------------------------------------
    # Docker DNS resolver
    # -----------------------------------------------------------------------
    # Docker embedded DNS inside the container network. We use a variable-based
    # proxy_pass below so nginx resolves "api" at request time (survives api
    # container restarts that change its IP).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Shared proxy settings
    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_read_timeout  60s;
    proxy_send_timeout  60s;

    # WebSocket upgrade headers (applied in ws locations)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # -----------------------------------------------------------------------
    # Rate limiting zone (spec §3.2: 1 req / 5 s per IP = 12 req/min)
    # -----------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=public_api:10m rate=12r/m;

    # -----------------------------------------------------------------------
    # 1. HTTP → HTTPS redirect (public)
    # -----------------------------------------------------------------------
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # -----------------------------------------------------------------------
    # 2. Public HTTPS server (port 443)
    # -----------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name _;

        set $api_upstream api:8000;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.3;
        ssl_prefer_server_ciphers on;

        # -- Public REST API -------------------------------------------------
        location /api/v1/public/ {
            limit_req zone=public_api burst=5 nodelay;
            add_header X-RateLimit-Remaining $limit_req_status always;

            proxy_pass http://$api_upstream;
        }

        # -- Bus-client ingest (private, authenticated by Bearer token) ------
        location /api/v1/positions {
            proxy_pass http://$api_upstream;
        }

        # -- Public WebSocket (/ws/buses) ------------------------------------
        location /ws/buses {
            proxy_pass http://$api_upstream;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;   # keep WS alive for 1 h
        }

        # -- Static public site ----------------------------------------------
        location / {
            proxy_pass http://$api_upstream;
        }
    }

    # -----------------------------------------------------------------------
    # 3. Admin server — localhost only, port 8080 (spec §1.3)
    # -----------------------------------------------------------------------
    server {
        # Bind inside the container; host exposure is restricted by Docker
        # port-publishing (docker-compose maps this to 127.0.0.1:8080).
        listen 8080;

        set $api_upstream api:8000;

        # -- Admin REST API --------------------------------------------------
        location /api/v1/admin/ {
            proxy_pass http://$api_upstream;
        }

        # -- Admin WebSocket (/ws/admin) -------------------------------------
        location /ws/admin {
            proxy_pass http://$api_upstream;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        # -- Admin HTML/JS dashboard -----------------------------------------
        location / {
            proxy_pass http://$api_upstream;
        }
    }
}
