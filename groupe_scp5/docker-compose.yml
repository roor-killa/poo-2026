services:
  db:
    image: pgvector/pgvector:pg15
    container_name: langmatinitje_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-langmatinitje}
      POSTGRES_USER: ${POSTGRES_USER:-creole}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scraper/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./scraper/db/02_documents.sql:/docker-entrypoint-initdb.d/02_documents.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - langmatinitje_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-creole} -d ${POSTGRES_DB:-langmatinitje}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4-standalone
    container_name: langmatinitje_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
    depends_on:
      db:
        condition: service_healthy
    networks:
      - langmatinitje_net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: langmatinitje_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-langmatinitje}
      POSTGRES_USER: ${POSTGRES_USER:-creole}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      API_KEY: ${API_KEY:-changeme}
      FEFEN_DATASET_DIR: /app/dataset/data
      HF_TOKEN: ${HF_TOKEN:-}
      FEFEN_MODEL: ${FEFEN_MODEL:-mistralai/Mixtral-8x7B-Instruct-v0.1}
    volumes:
      - ./dataset/data:/app/dataset/data:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - langmatinitje_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: langmatinitje_backend
    restart: unless-stopped
    ports:
      - "${LARAVEL_PORT:-8001}:8001"
    environment:
      APP_NAME: "Lang Matinitjé"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost:${LARAVEL_PORT:-8001}"
      APP_KEY: ${LARAVEL_APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-langmatinitje}
      DB_USERNAME: ${POSTGRES_USER:-creole}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SANCTUM_STATEFUL_DOMAINS: "localhost:${FRONTEND_PORT:-3000},127.0.0.1:${FRONTEND_PORT:-3000}"
      CORS_ALLOWED_ORIGINS: "http://localhost:${FRONTEND_PORT:-3000}"
      CACHE_STORE: database
      SESSION_DRIVER: database
    depends_on:
      db:
        condition: service_healthy
    networks:
      - langmatinitje_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_FASTAPI_URL: "http://localhost:${API_PORT:-8000}/api/v1"
        NEXT_PUBLIC_LARAVEL_URL: "http://localhost:${LARAVEL_PORT:-8001}/api"
    container_name: langmatinitje_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_FASTAPI_URL: "http://localhost:${API_PORT:-8000}/api/v1"
      NEXT_PUBLIC_LARAVEL_URL: "http://localhost:${LARAVEL_PORT:-8001}/api"
      # URLs internes Docker pour le rendu SSR (Server Components)
      # Le container frontend ne peut pas atteindre localhost:8000/8001
      FASTAPI_INTERNAL_URL: "http://api:8000/api/v1"
      LARAVEL_INTERNAL_URL: "http://backend:8001/api"
      FASTAPI_API_KEY: ${API_KEY:-changeme}
    depends_on:
      - api
      - backend
    networks:
      - langmatinitje_net

volumes:
  postgres_data:
    name: langmatinitje_postgres_data

networks:
  langmatinitje_net:
    name: langmatinitje_net
