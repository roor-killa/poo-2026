services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: rtg-backend
    restart: always
    expose:
      - "8000"

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: rtg-frontend
    restart: always
    expose:
      - "80"

  gateway:
    image: nginx:1.27-alpine
    container_name: rtg-gateway
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
