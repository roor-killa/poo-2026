services:
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: rtg-backend
    ports:
      - "18000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://rtg:rtg@db:5432/rtg
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: rtg-db
    environment:
      POSTGRES_DB: rtg
      POSTGRES_USER: rtg
      POSTGRES_PASSWORD: rtg
    ports:
      - "5432:5432"
    volumes:
      - rtg_pgdata:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rtg-frontend
    ports:
      - "18080:80"
    depends_on:
      - backend

volumes:
  rtg_pgdata:
