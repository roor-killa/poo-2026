name: CD

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "akonou/Transport/**"
      - ".github/workflows/cd.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/rtg-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/rtg-frontend

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./akonou/Transport/api
          file: ./akonou/Transport/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./akonou/Transport/frontend
          file: ./akonou/Transport/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            mkdir -p /opt/rtg-transport
            cd /opt/rtg-transport
            if [ ! -d .git ]; then
              git clone https://github.com/${{ github.repository }} .
            fi
            git fetch --all
            git checkout main
            git pull origin main
            cd akonou/Transport
            cat > .env.prod <<EOF
            BACKEND_IMAGE=${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            FRONTEND_IMAGE=${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
            EOF
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
