<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineScrap | Accueil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #141414; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow-x: hidden; }
        .glass-card {
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-5px);
            border-color: #E50914; 
            box-shadow: 0 10px 30px -10px rgba(229, 9, 20, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-6xl w-full h-full">
        <header class="flex justify-between items-center py-6 border-b border-gray-800 mb-8">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-film text-3xl text-[#E50914]"></i>
                <h2 class="text-2xl font-bold">Cine<span class="text-[#E50914]">Scrap</span> Martinique</h2>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-sm text-green-400 bg-green-400/10 px-3 py-1 rounded-full"><i class="fa-solid fa-circle-check mr-2"></i>Données à jour</span>
                
                <a href="admin.html" class="text-gray-600 hover:text-white transition-colors" title="Accès Administrateur">
                    <i class="fa-solid fa-lock text-xl"></i>
                </a>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="glass-card p-6 rounded-xl border-l-4 border-l-[#E50914]">
                <h3 class="text-gray-400 text-sm font-semibold uppercase tracking-wider mb-1">Cinémas Ciblés</h3>
                <p class="text-3xl font-bold">Madiana</p>
            </div>
            <div class="glass-card p-6 rounded-xl border-l-4 border-l-blue-500">
                <h3 class="text-gray-400 text-sm font-semibold uppercase tracking-wider mb-1">Dernière Mise à Jour</h3>
                <p class="text-3xl font-bold text-blue-400" id="current-time">Aujourd'hui</p>
            </div>
            <div class="glass-card p-6 rounded-xl border-l-4 border-l-green-500">
                <h3 class="text-gray-400 text-sm font-semibold uppercase tracking-wider mb-1">Statut du Serveur</h3>
                <p class="text-3xl font-bold text-green-400">En Ligne</p>
            </div>
        </div>

        <h3 class="text-xl font-semibold mb-6 flex items-center gap-2"><i class="fa-solid fa-popcorn text-gray-400"></i> Au programme</h3>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            
            <a href="scraping_madiana_uniquement.html" class="glass-card group block p-6 rounded-2xl relative overflow-hidden">
                <div class="absolute -right-4 -top-4 w-24 h-24 bg-red-500/10 rounded-full blur-xl group-hover:bg-red-500/30 transition-all"></div>
                <i class="fa-solid fa-film text-4xl text-[#E50914] mb-4"></i>
                <h4 class="text-xl font-bold mb-2 text-white">Séances Madiana</h4>
                <p class="text-sm text-gray-400 mb-6">Consulter les horaires des films actuellement à l'affiche en Martinique.</p>
                <div class="flex items-center text-[#E50914] font-semibold text-sm">
                    <span>Voir les films</span>
                    <i class="fa-solid fa-arrow-right ml-2 group-hover:translate-x-2 transition-transform"></i>
                </div>
            </a>

        </div>
    </div>

    <script>
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-time').textContent = new Date().toLocaleDateString('fr-FR', options);
    </script>
</body>
</html>
