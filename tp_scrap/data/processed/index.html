<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineScrap | Mobile Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f0f0f; color: #ffffff; font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .status-badge { background: rgba(34, 197, 94, 0.1); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.2); }
    </style>
</head>
<body class="p-4 pb-20">

    <div class="max-w-md mx-auto">
        <header class="flex justify-between items-center mb-8 pt-2">
            <div>
                <h1 class="text-xl font-black tracking-tight">CINE<span class="text-red-600">SCRAP</span></h1>
                <p class="text-[10px] text-gray-500 uppercase tracking-widest">Dashboard Martinique</p>
            </div>
            <div class="flex items-center gap-3">
                <div class="status-badge text-[10px] px-2 py-1 rounded-full flex items-center gap-1">
                    <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span> Actif
                </div>
                <a href="admin.html" class="text-gray-400"><i class="fa-solid fa-lock text-lg"></i></a>
            </div>
        </header>

        <div class="grid grid-cols-2 gap-3 mb-8">
            <div class="glass-card p-4 rounded-2xl">
                <p class="text-[10px] text-gray-500 uppercase mb-1">Cinémas</p>
                <p class="text-lg font-bold">Madiana</p>
            </div>
            <div class="glass-card p-4 rounded-2xl border-b-2 border-b-blue-500">
                <p class="text-[10px] text-gray-500 uppercase mb-1">Serveur</p>
                <p class="text-lg font-bold text-blue-400">En Ligne</p>
            </div>
            <div class="glass-card p-4 rounded-2xl col-span-2">
                <p class="text-[10px] text-gray-500 uppercase mb-1">Dernière mise à jour</p>
                <p class="text-sm font-medium text-gray-300" id="current-time">Chargement...</p>
            </div>
        </div>

        <h3 class="text-sm font-semibold text-gray-400 mb-4 flex items-center gap-2">
            <i class="fa-solid fa-layer-group text-red-600"></i> SERVICES DISPONIBLES
        </h3>

        <a href="scraping_madiana_uniquement.html" class="glass-card flex items-center p-4 rounded-2xl gap-4 mb-4 active:scale-95 transition-transform">
            <div class="w-12 h-12 bg-red-600/20 rounded-xl flex items-center justify-center text-red-600">
                <i class="fa-solid fa-film text-xl"></i>
            </div>
            <div class="flex-1">
                <h4 class="font-bold text-sm">Séances Madiana</h4>
                <p class="text-[11px] text-gray-500">Voir les films à l'affiche</p>
            </div>
            <i class="fa-solid fa-chevron-right text-gray-700 text-xs"></i>
        </a>
    </div>

    <script>
        document.getElementById('current-time').textContent = new Date().toLocaleDateString('fr-FR', {
            weekday: 'long', day: 'numeric', month: 'long'
        });
    </script>
</body>
</html>
