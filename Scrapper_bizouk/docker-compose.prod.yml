name: rl_scrapper_bizouk

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: RL_bizouk_backend
    restart: unless-stopped
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./data:/project/data
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: RL_bizouk_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_BASE=/api
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    image: nginx:stable-alpine
    container_name: RL_bizouk_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
