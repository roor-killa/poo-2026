name: rl_scrapper_bizouk

services:
  # API Python: expose les routes FastAPI et lance les scrapers.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: RL_bizouk_backend
    volumes:
      - ./:/project
    working_dir: /project
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - SCRAPER_API_KEY=${SCRAPER_API_KEY:-dev-local-scraper-key}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-http://localhost:3005,http://127.0.0.1:3005}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-5}
    expose:
      - "8000"

  frontend:
    # Interface Next.js: formulaire, affichage des cartes et export JSON.
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: RL_bizouk_frontend
    environment:
      - NEXT_PUBLIC_API_BASE=/api
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    # Point d'entree local: redirige /api vers le backend et / vers le frontend.
    image: nginx:stable-alpine
    container_name: RL_bizouk_nginx
    ports:
      - "3005:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
